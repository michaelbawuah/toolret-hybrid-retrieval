[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolret-research"
version = "0.1.0"
description = "Independent ToolRet reproduction and retrieval research project."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dense = ["sentence-transformers>=3.0", "torch>=2.1"]
viz = ["matplotlib>=3.8"]

[project.scripts]
toolret-baseline = "toolret_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
